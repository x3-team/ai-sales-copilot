# Blueprint: AI Sales Copilot (FastAPI)
# Live MVP: SQLite memory (ephemeral on free tier) — no extra Postgres/disk required.
services:
  - type: web
    name: ai-sales-copilot
    runtime: python
    plan: free
    region: frankfurt
    branch: cursor/lpr-webhook-45d2
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DEMO_MODE
        value: "0"
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBHOOK_HMAC_SECRET
        generateValue: true
      - key: DADATA_API_KEY
        sync: false
      - key: DADATA_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
