# Blueprint: AI Sales Copilot (FastAPI)
# Deploy: Render Dashboard → New → Blueprint → connect repo
services:
  - type: web
    name: ai-sales-copilot
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Persistent disk: jobs survive Render restarts (requires Starter+ plan)
    disk:
      name: lpr-jobs-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: LPR_JOBS_DB_PATH
        value: /var/data/lpr_jobs.db
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBHOOK_HMAC_SECRET
        generateValue: true
      - key: DADATA_API_KEY
        sync: false
      - key: DADATA_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "0"
